<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>경희여고 오늘 급식 알리미</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --primary: #4338ca;
      --primary-light: #eef2ff;
      --text: #1e293b;
      --sub-text: #64748b;
      --border: #e2e8f0;
      --tag-bg: #f1f5f9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 30px 16px;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border-radius: 24px;
      padding: 28px 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.06);
    }
    .school-tag {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--primary);
      background-color: var(--primary-light);
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 12px;
    }
    .date-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .nav-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--sub-text);
      cursor: pointer;
      transition: all 0.2s;
    }
    .nav-btn:hover {
      background: var(--tag-bg);
      color: var(--text);
    }
    .date-text {
      font-size: 1rem;
      font-weight: 700;
    }
    .meal-box {
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      min-height: 160px;
      background: #fafafa;
    }
    .menu-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px dashed var(--border);
      font-size: 0.98rem;
      font-weight: 500;
    }
    .menu-item:last-child {
      border-bottom: none;
    }
    .allergy-badge {
      font-size: 0.72rem;
      color: var(--sub-text);
      background: var(--tag-bg);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: normal;
    }
    .empty-state {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 120px;
      color: var(--sub-text);
      font-size: 0.95rem;
      text-align: center;
      line-height: 1.5;
    }
    .meta-info {
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--sub-text);
    }
    .feedback-box {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      text-align: center;
    }
    .stars {
      display: flex;
      justify-content: center;
      gap: 10px;
      font-size: 1.6rem;
      margin: 10px 0;
      cursor: pointer;
    }
    .star-item {
      transition: transform 0.15s;
    }
    .star-item:hover {
      transform: scale(1.2);
    }
    .vote-status {
      font-size: 0.82rem;
      color: var(--sub-text);
    }
  </style>
</head>
<body>

<div class="card">
  <span class="school-tag">경희여자고등학교</span>
  
  <div class="date-nav">
    <button class="nav-btn" onclick="moveDate(-1)">◀ 이전 날</button>
    <div id="dateDisplay" class="date-text">로딩 중...</div>
    <button class="nav-btn" onclick="moveDate(1)">다음 날 ▶</button>
  </div>

  <div id="mealContainer" class="meal-box">
    <div class="empty-state">급식 데이터를 불러오고 있습니다...</div>
  </div>

  <div class="meta-info">
    <span id="calorieInfo"></span>
  </div>

  <div class="feedback-box">
    <div style="font-weight: 600; font-size: 0.95rem;">오늘 급식 만족도 평가 ⭐</div>
    <div class="stars">
      <span class="star-item" onclick="submitVote(1)">⭐</span>
      <span class="star-item" onclick="submitVote(2)">⭐</span>
      <span class="star-item" onclick="submitVote(3)">⭐</span>
      <span class="star-item" onclick="submitVote(4)">⭐</span>
      <span class="star-item" onclick="submitVote(5)">⭐</span>
    </div>
    <div id="voteMessage" class="vote-status">별을 클릭해 점수를 매겨보세요.</div>
  </div>
</div>

<script>
  // 경희여자고등학교 교육청 및 학교 코드
  const ATPT_CODE = "B10";
  const SCHUL_CODE = "7010127";
  
  let targetDate = new Date();

  function getFormattedDate(d) {
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return `${yyyy}${mm}${dd}`;
  }

  function updateDateTitle(d) {
    const days = ['일', '월', '화', '수', '목', '금', '토'];
    const formatted = `${d.getMonth() + 1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
    document.getElementById("dateDisplay").innerText = formatted;
  }

  function moveDate(days) {
    targetDate.setDate(targetDate.getDate() + days);
    fetchSchoolMeal();
    refreshVoteStatus();
  }

  async function fetchSchoolMeal() {
    updateDateTitle(targetDate);
    const dateStr = getFormattedDate(targetDate);
    const mealContainer = document.getElementById("mealContainer");
    const calorieInfo = document.getElementById("calorieInfo");

    mealContainer.innerHTML = '<div class="empty-state">식단 정보를 가져오는 중...</div>';
    calorieInfo.innerText = "";

    const url = `https://open.neis.go.kr/hub/mealServiceDietInfo?Type=json&pIndex=1&pSize=5&ATPT_OFCDC_SC_CODE=${ATPT_CODE}&SD_SCHUL_CODE=${SCHUL_CODE}&MLSV_YMD=${dateStr}`;

    try {
      const response = await fetch(url);
      const json = await response.json();

      if (json.RESULT && json.RESULT.CODE !== "INFO-000") {
        mealContainer.innerHTML = '<div class="empty-state">급식 정보가 없습니다.<br>(주말, 휴업일 또는 미등록)</div>';
        return;
      }

      const mealData = json.mealServiceDietInfo[1].row[0];
      const rawDishes = mealData.DDISH_NM.split("<br/>");

      const parsedItems = rawDishes.map(dish => {
        const match = dish.match(/\(([^)]+)\)/);
        const name = dish.replace(/\([^)]+\)/g, "").trim();
        const allergy = match ? `알레르기: ${match[1]}` : "";
        
        return `
          <div class="menu-item">
            <span>${name}</span>
            ${allergy ? `<span class="allergy-badge">${allergy}</span>` : ""}
          </div>
        `;
      }).join("");

      mealContainer.innerHTML = parsedItems;
      calorieInfo.innerText = `총 칼로리: ${mealData.CAL_INFO}`;

    } catch (err) {
      console.error(err);
      mealContainer.innerHTML = '<div class="empty-state">데이터를 가져오지 못했습니다.<br>잠시 후 다시 시도해주세요.</div>';
    }
  }

  function submitVote(score) {
    const key = `kyunghee_vote_${getFormattedDate(targetDate)}`;
    localStorage.setItem(key, score);
    refreshVoteStatus();
  }

  function refreshVoteStatus() {
    const key = `kyunghee_vote_${getFormattedDate(targetDate)}`;
    const saved = localStorage.getItem(key);
    const msgEl = document.getElementById("voteMessage");
    if (saved) {
      msgEl.innerText = `오늘 내 점수: ${saved}점 ⭐ (저장됨)`;
      msgEl.style.color = "#4338ca";
    } else {
      msgEl.innerText = "별을 클릭해 점수를 매겨보세요.";
      msgEl.style.color = "#64748b";
    }
  }

  // 화면 진입 시 초기화
  fetchSchoolMeal();
  refreshVoteStatus();
</script>

</body>
</html>
